[package]
name = "w3warehouse-parse"
version = "0.1.0"
edition = "2021"
description = "Backend replay tooling for w3warehouse (parse / mappings / S3-to-ClickHouse drain), via the w3grs Rust port of w3gjs."
license = "MIT"

[lib]
name = "w3warehouse_parse"
path = "src/lib.rs"

[[bin]]
name = "parse"
path = "src/bin/parse.rs"

[[bin]]
name = "export-mappings"
path = "src/bin/export-mappings.rs"

[[bin]]
name = "drain"
path = "src/bin/drain.rs"

[dependencies]
# tanghyd/w3grs main, upstream w3grs plus three patches: unknown object codes are kept, every
# leave block and the saver's player id are serialized, and a building placement keeps its x
# and y. See the fork's README.
w3grs = { git = "https://github.com/tanghyd/w3grs", rev = "476fd35d30af72c91464eb0ee6862af1a1a58fe6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# drain (S3 list and get, ClickHouse over HTTP) only:
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
aws-sdk-s3 = "1"
aws-smithy-types = "1"
futures = "0.3"
# Plain HTTP to ClickHouse on the compose network: no TLS, no HTTP/2.
reqwest = { version = "0.12", default-features = false }

[profile.release]
# Replay parsing is CPU-bound; let the optimiser go hard. lto=thin is the cheap
# 90% of fat-lto.
lto = "thin"
