[package]
name = "w3warehouse-parse"
version = "0.1.0"
edition = "2021"
description = "Backend replay tooling for w3warehouse (parse / mappings / S3 drain), via the w3grs Rust port of w3gjs."
license = "MIT"

[lib]
name = "w3warehouse_parse"
path = "src/lib.rs"

[[bin]]
name = "parse"
path = "src/bin/parse.rs"

[[bin]]
name = "export-mappings"
path = "src/bin/export-mappings.rs"

[[bin]]
name = "drain"
path = "src/bin/drain.rs"

[dependencies]
# Upstream w3grs plus two patches: unknown object codes are kept, and every leave block and the
# saver's player id are serialized. See the fork's README.
w3grs = { git = "https://github.com/tanghyd/w3grs", rev = "a1b8c1e1ebc9ee40612fa6640bf6808b69b41669" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# drain (S3 object-store worker) only:
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
aws-sdk-s3 = "1"
aws-smithy-types = "1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
# Replay parsing is CPU-bound; let the optimiser go hard. lto=thin is the cheap
# 90% of fat-lto.
lto = "thin"
