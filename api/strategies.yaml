# Strategy presets: named sides of the strategy search. GET /strategies answers them and
# POST /strategies/stats counts them, compiled like a side of POST /search.
#
#   id, name    unique id and display name
#   race        HU, OC, NE or UD: the race whose player-games the preset counts
#   parent_id   a variant's parent; the variant holds the parent's steps, then its own
#   steps       one group of POST /search steps (api/compile.py SearchStep): kind, codes,
#               count, exactly, from_s, to_s, link, within_s, nth, before, negate, forward
#   source      w3warehouse: the 24 builds of w3warehouse (dev, services/api/src/api/builds.py),
#               with their expansion times: fast by 6:00 Human, 9:00 Night Elf, 10:30 Orc,
#               8:00 Undead, late to 15:00 (Orc 18:00). gym-replays: added here.
#               wc3-gnl-website: the website's build orders (scripts/builds/*.mjs), the steps
#               a player who follows the guide always does ("core"), measured in
#               threads/warehouse-dbt-prototype/redesign/website-builds/measure.md
#   vs_races    the opponent races a website guide is written for ([] for any)

