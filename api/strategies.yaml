# Tower rush: 2 or more forward towers in the window, forward meaning under 3,000 units from the
# opponent's start location (player_starts). Measured 2026-10-02 on 1,706 games: 25 of the 60
# picked Humans with 3 Scout Towers by 4:00. Orc and Night Elf below. No Undead preset: a Ziggurat is also the farm.
- {id: hu-tower-rush, name: Tower rush, race: HU, source: gym-replays, steps: [
    {kind: building, codes: [hwtw], count: 3, to_s: 240},
    {kind: building, codes: [hwtw], count: 2, to_s: 240, forward: true}]}

