[project]
name = "warehouse-api"
version = "0.1.0"
description = "Semantic query API over the dbt marts in ClickHouse."
requires-python = ">=3.13"
# httpx keeps one connection pool to ClickHouse; pydantic is imported directly by compile.py.
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2", "pyyaml>=6", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
