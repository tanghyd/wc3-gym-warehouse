# The warehouse: ClickHouse, the parse drain, dbt, the query API and the page.
# Replays live in an S3 bucket (R2 in production, MinIO under the `local`
# profile), never on the box.
#
#   just up                   # every long-running service (COMPOSE_PROFILES in .env)
#   just dbt build            # load new parsed docs and rebuild the marts
#   docker compose --profile prod up -d   # ... plus the Cloudflare Tunnel
name: wc3-gym-warehouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_API_PASSWORD: "${CLICKHOUSE_API_PASSWORD:-}"
      # The parsed docs dbt loads, read through the parsed_docs named collection.
      W3WAREHOUSE_PARSED_URL: "${W3WAREHOUSE_PARSED_URL}"
      W3WAREHOUSE_S3_ACCESS_KEY: "${W3WAREHOUSE_S3_ACCESS_KEY}"
      W3WAREHOUSE_S3_SECRET_KEY: "${W3WAREHOUSE_S3_SECRET_KEY}"
    restart: unless-stopped
    stop_grace_period: 60s          # the 10s default SIGKILL truncates the flush
    # Loopback only. The tunnel reaches ClickHouse over the compose network.
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - ch_store:/var/lib/clickhouse
      - ./infrastructure/docker/clickhouse/tuning.xml:/etc/clickhouse-server/config.d/tuning.xml:ro
      - ./infrastructure/docker/clickhouse/metric-log.xml:/etc/clickhouse-server/config.d/metric-log.xml:ro
      - ./infrastructure/docker/clickhouse/named-collections.xml:/etc/clickhouse-server/config.d/named-collections.xml:ro
      - ./infrastructure/docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/warehouse.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # CMD-SHELL so the container's $CLICKHOUSE_PASSWORD expands; $$ escapes
      # compose's own interpolation. An empty password drops the flag.
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 $${CLICKHOUSE_PASSWORD:+--password=$$CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Lists replays/, parses each new or changed .w3g, writes parsed/v2/…json.
  drain:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.drain
    environment:
      W3WAREHOUSE_S3_ENDPOINT: "${W3WAREHOUSE_S3_ENDPOINT}"
      W3WAREHOUSE_S3_SECURE: "${W3WAREHOUSE_S3_SECURE:-false}"
      W3WAREHOUSE_S3_ACCESS_KEY: "${W3WAREHOUSE_S3_ACCESS_KEY}"
      W3WAREHOUSE_S3_SECRET_KEY: "${W3WAREHOUSE_S3_SECRET_KEY}"
      W3WAREHOUSE_S3_BUCKET: "${W3WAREHOUSE_S3_BUCKET}"
      W3WAREHOUSE_S3_PREFIX: "${W3WAREHOUSE_S3_PREFIX:-}"
      WORKER_POLL_MS: "${WORKER_POLL_MS:-60000}"
    restart: unless-stopped

  # One-shot: `just dbt <args>`. Loads new parsed docs and builds the marts.
  dbt:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dbt
    profiles: ["tools"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      # Output goes to a volume the API reads, never into the bind mount as root.
      DBT_TARGET_PATH: /target
      DBT_LOG_PATH: /target/logs
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./dbt:/dbt
      - dbt_target:/target
      - dbt_cache:/root/.cache
    depends_on:
      clickhouse:
        condition: service_healthy

  # The query API. It reads the catalog from dbt's manifest and queries as the
  # read-only `api` user.
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_API_PASSWORD: "${CLICKHOUSE_API_PASSWORD:-}"
      DBT_MANIFEST: /target/manifest.json
    volumes:
      - dbt_target:/target:ro
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy

  # The search page, with /api/ proxied to the API. Loopback only.
  ui:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on: [api]

  # The replay inspector (web/). It reads the API over the compose network. Loopback only.
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on: [api]

  # One-shot: `just local::e2e`. Playwright tests of web/ and the page, run as you because it
  # writes web/e2e/node_modules and web/e2e/shots/. The tag matches web/e2e/package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: ["tools"]
    init: true
    shm_size: 1gb                   # Chromium runs out of the 64 MB default on long pages
    working_dir: /e2e
    environment:
      HOME: /tmp
      WEB_URL: http://web:3000
      UI_URL: http://ui
      API_URL: http://api:8000
    entrypoint: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && exec node_modules/.bin/playwright test \"$$@\"", "e2e"]
    volumes:
      - ./web/e2e:/e2e
    depends_on: [web, ui]

  # A local stand-in for the R2 bucket.
  minio:
    image: minio/minio
    profiles: ["local"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${W3WAREHOUSE_S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${W3WAREHOUSE_S3_SECRET_KEY}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Makes the bucket and puts the 3 parser goldens where the GNL backend would
  # put a reported replay: <prefix>/replays/<series>/game1.w3g, series 9001-9003.
  # Re-running uploads the same bytes, so the drain sees nothing new.
  minio-setup:
    image: minio/mc
    profiles: ["local"]
    environment:
      BUCKET: "${W3WAREHOUSE_S3_BUCKET}"
      PREFIX: "${W3WAREHOUSE_S3_PREFIX:-}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${W3WAREHOUSE_S3_ACCESS_KEY}' '${W3WAREHOUSE_S3_SECRET_KEY}' &&
      mc mb --ignore-existing local/$$BUCKET &&
      n=9000 && for f in /fixtures/*.w3g; do n=$$((n+1));
      mc cp -q \"$$f\" \"local/$$BUCKET/$${PREFIX:+$$PREFIX/}replays/$$n/game1.w3g\" || exit 1; done &&
      echo 'bucket ready with the goldens'
      "
    volumes:
      - ./pipeline/parse-rs/fixtures:/fixtures:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Outbound-only connections to Cloudflare, forwarded to clickhouse:8123
  # (infrastructure/cloudflared/config.yml.example).
  cloudflared:
    image: cloudflare/cloudflared
    profiles: ["prod"]
    command: tunnel --no-autoupdate run
    environment:
      # Compose interpolates every service before it applies profiles, so a `:?`
      # guard here would fail `up` on any machine with no tunnel. cloudflared
      # rejects an empty token itself, and only under the prod profile.
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    network_mode: "service:clickhouse"
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  ch_store:
  minio_data:
  dbt_target:
  dbt_cache:
