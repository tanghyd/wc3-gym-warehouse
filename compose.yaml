# The warehouse: ClickHouse, the parse drain, dbt, the query API, the page and Grafana.
# Replays live in an S3 bucket (R2 in production, MinIO under the `local`
# profile), never on the box. The drain and dbt only read the bucket.
#
#   just up                   # every long-running service (COMPOSE_PROFILES in .env)
#   just local::ingest        # one drain pass, then dbt build when it inserted documents
#   docker compose --profile tunnel up -d # ... plus the Cloudflare Tunnel, once a domain exists
#
# The box is a Hetzner CX33 (8 GB): the measured local peaks sum to about 2.3 GiB, but the
# box also builds the drain and web images while ClickHouse is live (docs/deploy.md).
name: wc3-gym-warehouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_API_PASSWORD: "${CLICKHOUSE_API_PASSWORD:-}"
      CLICKHOUSE_GRAFANA_PASSWORD: "${CLICKHOUSE_GRAFANA_PASSWORD:-}"
      CLICKHOUSE_INGEST_PASSWORD: "${CLICKHOUSE_INGEST_PASSWORD:-}"
    restart: unless-stopped
    stop_grace_period: 60s          # the 10s default SIGKILL truncates the flush
    # Measured resident 1.11 GiB, peak 1.68 GiB on 1,746 replays. tuning.xml caps the server at 2.5 GiB.
    mem_limit: 3g
    # Loopback only. Nothing outside the box reaches ClickHouse.
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - ch_store:/var/lib/clickhouse
      - ./infrastructure/docker/clickhouse/tuning.xml:/etc/clickhouse-server/config.d/tuning.xml:ro
      - ./infrastructure/docker/clickhouse/metric-log.xml:/etc/clickhouse-server/config.d/metric-log.xml:ro
      - ./infrastructure/docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/warehouse.xml:ro
      # The drain's ingest tables. The image runs it on an empty volume only.
      - ./infrastructure/docker/clickhouse/ingest.sql:/docker-entrypoint-initdb.d/ingest.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # CMD-SHELL so the container's $CLICKHOUSE_PASSWORD expands; $$ escapes
      # compose's own interpolation. An empty password drops the flag.
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 $${CLICKHOUSE_PASSWORD:+--password=$$CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot: `just local::ingest` or `just local::drain-once`. Lists each source's replay
  # prefix, parses each new or changed .w3g and inserts it into ingest.docs as the ingest user.
  drain:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.drain
    profiles: ["tools"]
    environment:
      W3WAREHOUSE_S3_ENDPOINT: "${W3WAREHOUSE_S3_ENDPOINT}"
      W3WAREHOUSE_S3_SECURE: "${W3WAREHOUSE_S3_SECURE:-false}"
      W3WAREHOUSE_S3_ACCESS_KEY: "${W3WAREHOUSE_S3_ACCESS_KEY}"
      W3WAREHOUSE_S3_SECRET_KEY: "${W3WAREHOUSE_S3_SECRET_KEY}"
      W3WAREHOUSE_S3_BUCKET: "${W3WAREHOUSE_S3_BUCKET}"
      W3WAREHOUSE_S3_PREFIX: "${W3WAREHOUSE_S3_PREFIX:-}"
      # A second read-only source, on when its bucket is set.
      W3WAREHOUSE_SOURCE2_ENDPOINT: "${W3WAREHOUSE_SOURCE2_ENDPOINT:-}"
      W3WAREHOUSE_SOURCE2_SECURE: "${W3WAREHOUSE_SOURCE2_SECURE:-true}"
      W3WAREHOUSE_SOURCE2_ACCESS_KEY: "${W3WAREHOUSE_SOURCE2_ACCESS_KEY:-}"
      W3WAREHOUSE_SOURCE2_SECRET_KEY: "${W3WAREHOUSE_SOURCE2_SECRET_KEY:-}"
      W3WAREHOUSE_SOURCE2_BUCKET: "${W3WAREHOUSE_SOURCE2_BUCKET:-}"
      W3WAREHOUSE_SOURCE2_PREFIX: "${W3WAREHOUSE_SOURCE2_PREFIX:-}"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_INGEST_PASSWORD: "${CLICKHOUSE_INGEST_PASSWORD:-}"
    mem_limit: 512m

  # One-shot: `just dbt <args>`. Reads ingest.docs and builds the marts.
  dbt:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dbt
    profiles: ["tools"]
    mem_limit: 1g
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      # Output goes to a volume the API and the docs site read, never into the bind mount as root.
      # Logs stay in the container, so the docs site serves dbt's artifacts only.
      DBT_TARGET_PATH: /target
      DBT_LOG_PATH: /tmp/dbt-logs
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./dbt:/dbt
      - dbt_target:/target
      - dbt_cache:/root/.cache
    depends_on:
      clickhouse:
        condition: service_healthy

  # The query API. It reads the catalog from dbt's manifest and queries as the
  # read-only `api` user.
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_API_PASSWORD: "${CLICKHOUSE_API_PASSWORD:-}"
      DBT_MANIFEST: /target/manifest.json
    # Loopback only; the docs are at /docs.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dbt_target:/target:ro
    restart: unless-stopped
    mem_limit: 512m
    # /health answers from the process alone; /ready also needs ClickHouse and the catalog.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      clickhouse:
        condition: service_healthy

  # dbt's docs site (`just local::docs` writes it into the target volume). Loopback only.
  docs:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - dbt_target:/usr/share/nginx/html:ro
    restart: unless-stopped
    mem_limit: 512m

  # The replay inspector (web/). It reads the API over the compose network. Loopback only.
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 512m
    # A port check: a page render would call the API ten times every interval.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  # One-shot: `just local::e2e`. Playwright tests of web/, run as you because it
  # writes web/e2e/node_modules and web/e2e/shots/. The tag matches web/e2e/package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: ["tools"]
    init: true
    shm_size: 1gb                   # Chromium runs out of the 64 MB default on long pages
    mem_limit: 2g                   # Chromium needs more than the dbt cap
    working_dir: /e2e
    environment:
      HOME: /tmp
      WEB_URL: http://web:3000
      API_URL: http://api:8000
      GRAFANA_URL: http://grafana:3000
      DOCS_URL: http://docs
    entrypoint: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && exec node_modules/.bin/playwright test \"$$@\"", "e2e"]
    volumes:
      - ./web/e2e:/e2e
    depends_on: [web, grafana, docs]

  # ClickHouse observability: Grafana with the ClickHouse plugin, reading as the
  # read-only `grafana` user. The datasource and the dashboards are provisioned
  # from infrastructure/docker/grafana/. Anonymous admin unless .env turns it off (the
  # GF_* keys in .env.example; `just deploy env` refuses a box .env that leaves it on).
  # Loopback only, on 3001 because the inspector has 3000. grafana/grafana is the OSS image.
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.22.0
      GF_AUTH_ANONYMOUS_ENABLED: "${GF_AUTH_ANONYMOUS_ENABLED:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "${GF_AUTH_ANONYMOUS_ORG_ROLE:-Admin}"
      GF_AUTH_DISABLE_LOGIN_FORM: "${GF_AUTH_DISABLE_LOGIN_FORM:-true}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      # The datasource file reads it.
      CLICKHOUSE_GRAFANA_PASSWORD: "${CLICKHOUSE_GRAFANA_PASSWORD:-}"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/docker/grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    mem_limit: 768m                 # measured 450 MiB idle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      clickhouse:
        condition: service_healthy

  # A local stand-in for the R2 bucket.
  minio:
    image: minio/minio
    profiles: ["local"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${W3WAREHOUSE_S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${W3WAREHOUSE_S3_SECRET_KEY}"
    volumes:
      - minio_data:/data
    mem_limit: 1g                   # measured 578 MiB
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Makes the bucket and puts the 3 parser goldens under <prefix>/replays/goldens/,
  # each with its own file name. Re-running uploads the same bytes, so the drain
  # sees nothing new.
  minio-setup:
    image: minio/mc
    profiles: ["local"]
    mem_limit: 256m
    environment:
      BUCKET: "${W3WAREHOUSE_S3_BUCKET}"
      PREFIX: "${W3WAREHOUSE_S3_PREFIX:-}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${W3WAREHOUSE_S3_ACCESS_KEY}' '${W3WAREHOUSE_S3_SECRET_KEY}' &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc cp -q /fixtures/*.w3g \"local/$$BUCKET/$${PREFIX:+$$PREFIX/}replays/goldens/\" &&
      echo 'bucket ready with the goldens'
      "
    volumes:
      - ./pipeline/parse-rs/fixtures:/fixtures:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Outbound-only connections to Cloudflare, forwarded to the inspector at web:3000
  # (infrastructure/cloudflared/config.yml.example). The API and ClickHouse stay private.
  # Off until a domain exists; until then the box is reached over ssh (docs/deploy.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Compose interpolates every service before it applies profiles, so a `:?`
      # guard here would fail `up` on any machine with no tunnel. cloudflared
      # rejects an empty token itself, and only under the tunnel profile.
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    restart: unless-stopped
    mem_limit: 512m
    depends_on: [web]

volumes:
  ch_store:
  minio_data:
  dbt_target:
  dbt_cache:
  grafana_data:

# A fixed subnet, so users.xml can name it for the `default` and `ingest` users.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
