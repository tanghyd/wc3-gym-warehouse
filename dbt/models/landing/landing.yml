sources:
  - name: bucket
    description: >-
      The object store bucket (MinIO locally, Cloudflare R2 in production). ClickHouse
      reads it through S3 tables in the bucket database, which the on-run-start hook in
      dbt_project.yml creates over named collections that hold the URL and the keys.
    schema: bucket
    tables:
      - name: parsed_docs
        description: >-
          The parsed replay documents the drain writes to
          parsed/v<parser version>/dt=<date>/<replay_id>.json, one JSON document per
          replay. An S3 table (format JSONAsString) over the parsed_docs named collection.
          A read lists the prefix and fetches each matching file.
        config:
          # DateTime64: dbt 2.0.6 reads a ClickHouse DateTime back as UInt32, not a timestamp.
          loaded_at_field: "toDateTime64(_time, 3)"
          freshness:
            warn_after: {count: 7, period: day}
        columns:
          - name: doc
            description: One parsed replay document as JSON text, as w3grs wrote it plus the drain's source_key (the raw object key) and parse_version.

models:
  - name: raw_replays
    description: >-
      The parsed replay documents loaded from the bucket. A ReplacingMergeTree on replay_id
      with parse_version as its version: a second copy of a document collapses into one
      row, and a document at a newer parse version replaces the older one, both at the next
      merge. Until then a replay can have more than one row, so a reader reads the table
      with SETTINGS final = 1 or FINAL. Incremental: a run appends only the documents
      whose replay is not loaded at the same or a newer parse version.
    columns:
      - name: replay_id
        description: "{{ doc('replay_id') }} Read from the document's id field."
        data_tests:
          - not_null:
              description: Every loaded document has an id.
      - name: doc
        description: The whole parsed document as JSON text. Every mart extracts its fields from here.
      - name: ingested_at
        description: When the run that loaded this document started (server time).
      - name: parse_version
        description: The parser version (PARSE_VERSION) the drain stamped into the document, the table's version column. 0 for a document from before the stamp.
