data_tests:
  - name: one_v_one_replays_have_two_player_games
    description: >-
      Every 1on1 replay that stands for its game has exactly two player_games rows, one per
      player, and a duplicate replay has none.
  - name: no_event_after_game_end
    description: >-
      No order or hero skill lies more than 5 s after the replay header's duration.
      Severity warn so a failure does not stop player_games from building.
  - name: openers_have_no_gaps
    description: opener_N is empty whenever opener_N-1 is, so the opener tree never skips a level.
  - name: builds_have_a_patch
    description: >-
      Every replay's build number has a row in the patches seed. Severity warn, so a new
      build shows as a warning with patch '' until someone adds its row.
  - name: duplicates_point_to_their_game
    description: Every game_key has exactly one replay that stands for it, and each duplicate points to that replay.
  - name: objects_are_named_and_complete
    description: Every picker object has a name in mappings, and every melee skill sits under a hero.
