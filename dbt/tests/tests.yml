data_tests:
  - name: one_v_one_replays_have_two_player_games
    description: >-
      Every 1on1 replay that stands for its game has exactly two player_games rows, one per
      player, and a duplicate replay has none.
  - name: no_event_after_game_end
    description: >-
      No order or hero skill lies more than 5 s after the replay header's duration.
      Severity warn so a failure does not stop player_games from building.
  - name: openers_have_no_gaps
    description: opener_N is empty whenever opener_N-1 is, so the opener tree never skips a level.
  - name: builds_have_a_patch
    description: >-
      Every replay's build number has a row in the patches seed. Severity warn, so a new
      build shows as a warning with patch '' until someone adds its row.
  - name: duplicates_point_to_their_game
    description: Every game_key has exactly one replay that stands for it, and each duplicate points to that replay.
  - name: objects_are_named_and_complete
    description: Every picker object has a name in mappings, and every melee skill sits under a hero.
  - name: every_player_gave_an_order
    description: Every player in replay_players has a row in player_order_events, because valid_replays leaves out a game in which a player gave no order.
  - name: start_locations_two_or_four_per_map
    description: Every map in the start_locations seed has 2 or 4 start locations, as the 1v1 and 1v1-2v2 maps do.
  - name: player_starts_differ_in_a_game
    description: The two players of a 1on1 replay never get the same start location, since two players never share one.
  - name: results_complement
    description: >-
      The two player_games rows of a game hold one win and one loss, or two unknowns, because
      a result is one game fact seen from two seats.
  - name: winner_names_match_winning_team
    description: winner_names is set exactly when winning_team_id names a team.
  - name: dropped_games_are_few
    description: >-
      At most 5% of loaded replays are dropped for a player with no order (40 of 1,746 on
      2026-10-02). Severity warn, because a jump means the parser or the rule changed.
  - name: one_v_one_maps_have_start_locations
    description: >-
      Every map of a 1on1 replay has rows in the start_locations seed, since player_starts
      gives 'none' without an error on a map it lacks. Severity warn until someone adds the map.
  - name: docs_have_required_keys
    description: Every loaded document has each key the marts read, since a renamed key would empty a column in silence.
