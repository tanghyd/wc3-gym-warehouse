macros:
  - name: race_code
    description: >-
      Maps the parser's race letter to its race code: H to HU, O to OC, N to NE,
      U to UD, R to RANDOM. Any other value passes through unchanged, so the race
      accepted_values tests catch it. Returns LowCardinality(String).
    arguments:
      - name: expr
        type: string
        description: A SQL expression that yields the parser's race letter, such as JSONExtractString(p, 'race').

  - name: clickhouse__current_timestamp
    description: >-
      Overrides the ClickHouse adapter's current time with now64(3), a DateTime64. dbt
      2.0.6 reads now(), a DateTime, back as UInt32 and fails source freshness on it.
