<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concealed Hill replay</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3.8.0/dist/vuetify.min.css">
<link rel="stylesheet" href="./tokens.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vuetify@3.8.0/dist/vuetify.min.js"></script>
<script src="./theme.js"></script>

  .v-application, .v-overlay-container { font-family: var(--font-body); }
  .v-btn, .v-tab { font-family: inherit; text-transform: none; letter-spacing: normal; }
  .wrap { max-width: 1200px; margin-inline: auto; padding-inline: 24px; box-sizing: border-box; }
  .band .wrap { padding-block: 30px 32px; }
  .band h1 { color: var(--on-band); font-size: 40px; }
  .band .v-icon { color: var(--band-muted); }
  .band .race { border-radius: 50%; box-shadow: 0 0 0 1px var(--band-muted); }
  .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
  .ico { display: inline-flex; align-items: center; gap: 4px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
  .panel-head { flex-wrap: wrap; row-gap: 8px; }
  .key { display: inline-block; width: 16px; height: 3px; border-radius: var(--radius); flex: none; }
  .obj { display: block; border-radius: var(--radius); flex: none; }
  .chart-box { position: relative; }
  .tip { min-width: 150px; }
  .tip-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .hero { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
  .hero + .hero { margin-top: 14px; }
  .skills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .skill { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
  .ev { display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 14px; }
  .ev-l { justify-content: flex-end; text-align: right; }
  .trail { display: flex; gap: 4px; padding: 0 0 6px 32px; }
  .ev-l + .trail, .trail-l { justify-content: flex-end; padding: 0 32px 6px 0; }
  .bo td { vertical-align: top; padding-block: 2px; }
  .bo .t { width: 64px; text-align: center; color: var(--muted); font-size: 13px; padding-top: 7px; }
  .bo th { color: var(--secondary); font-size: 14px; }
  .chat-row { display: grid; grid-template-columns: 44px auto 1fr; gap: 12px; align-items: center; padding: 4px 0; font-size: 14px; }
  .state-block { padding: 48px 16px; text-align: center; }
  @media (max-width: 600px) {
    .wrap { padding-inline: 16px; }
    .band .wrap { padding-block: 22px 24px; }
    .band h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="app-tpl">
<v-app>
  <header class="bar">
    <a class="brand" href="#">GNL replays</a>
    <nav class="d-flex ga-6">
      <a class="navlink" href="#">Search</a><a class="navlink" href="#">Openers</a><a class="navlink" href="#">Stats</a>
    </nav>
    <theme-menu class="push"></theme-menu>
  </header>

  <v-main>
    <div v-if="STATE === 'missing'" class="wrap state-block">
      <h2 class="mb-4">No game with this id</h2>
      <a class="btn ghost" href="#"><v-icon size="18" icon="mdi-magnify" />Go to Search</a>
    </div>
    <div v-else-if="STATE === 'offline'" class="wrap state-block">
      <h2 class="mb-4">Warehouse offline</h2>
      <button class="btn ghost"><v-icon size="18" icon="mdi-refresh" />Retry</button>
    </div>
    <template v-else>

    <section class="band">
      <div class="wrap">
        <div class="title-row">
          <h1 class="mr-auto">{{ R.map }}</h1>
          <a class="btn" :href="R.download_url"><v-icon size="18" icon="mdi-download" style="color:inherit" />Download replay</a>
        </div>
        <div class="d-flex flex-wrap align-center mt-3" style="column-gap:14px; row-gap:6px; font-size:17px">
          <template v-for="(p, i) in R.players" :key="p.player_id">
            <span v-if="i" class="muted">v</span>
            <span class="pname">
              <span :class="p.won ? 'font-weight-bold' : ''">{{ p.name }}</span>
              <race-icon :race="p.race" :size="20" />
              <v-icon v-if="p.won" size="18" icon="mdi-trophy-outline" aria-label="Winner" />
            </span>
          </template>
        </div>
        <div class="meta mt-2 muted">
          <span class="ico"><v-icon size="16" icon="mdi-timer-outline" />{{ fmt(R.duration_ms) }}</span>
          <span class="ico"><v-icon size="16" icon="mdi-sword-cross" />{{ R.matchup }}</span>
          <span class="ico"><v-icon size="16" icon="mdi-tag-outline" />Patch {{ R.version }}</span>
        </div>
      </div>
    </section>

    <div class="wrap py-6">
      <div class="grid2">
        <div v-for="(p, i) in R.players" :key="p.player_id" class="panel">
          <div class="card-head">
            <span class="key" :style="{ background: seriesColor(i) }"></span>
            <span class="pname"><h3>{{ p.name }}</h3><race-icon :race="p.race" :size="20" /></span>
            <span class="tag push" :class="p.won ? 'accent' : ''">
              <v-icon v-if="p.won" size="16" icon="mdi-trophy-outline" />{{ p.won ? 'Won' : 'Lost' }}
            </span>
          </div>
          <div class="panel-body">
            <div class="d-flex align-baseline ga-2">
              <span class="figure">{{ p.apm }}</span><span class="muted">APM</span>
            </div>
            <hr class="rule my-4">
            <div v-for="h in p.heroes" :key="h.slot" class="hero">
              <obj-icon :code="h.code" :size="40" />
              <div>
                <div>
                  <span class="font-weight-medium">{{ nameOf(h.code) }}</span>
                  <span class="muted ml-2">Level {{ h.final_level }}</span>
                </div>
                <div class="skills">
                  <v-tooltip v-for="(s, j) in skillsOf(p.player_id, h.code)" :key="j" location="top"
                    :text="'Level ' + (j + 1) + ': ' + nameOf(s.code) + ' at ' + fmt(s.t)">
                    <template #activator="{ props }">
                      <div v-bind="props" class="skill" tabindex="0">
                        <obj-icon :code="s.code" :size="28" />
                        <span>{{ fmt(s.t) }}</span>
                      </div>
                    </template>
                  </v-tooltip>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel mt-4">
        <div class="panel-head">
          <h2 class="mr-auto">APM per minute</h2>
          <span class="chips" role="group" aria-label="View">
            <button class="chip" :class="apmView === 'chart' && 'on'" :aria-pressed="apmView === 'chart'" aria-label="Chart" @click="apmView = 'chart'"><v-icon size="18" icon="mdi-chart-line" /></button>
            <button class="chip" :class="apmView === 'table' && 'on'" :aria-pressed="apmView === 'table'" aria-label="Table" @click="apmView = 'table'"><v-icon size="18" icon="mdi-table" /></button>
          </span>
        </div>
        <div class="panel-body">
          <div v-if="apmView === 'chart'" class="d-flex flex-wrap mb-3" style="column-gap:20px; row-gap:4px">
            <span v-for="(p, i) in R.players" :key="p.player_id" class="d-inline-flex align-center ga-2 small ink-2">
              <span class="key" :style="{ background: seriesColor(i) }"></span>{{ p.name }}
            </span>
          </div>
          <apm-chart v-if="apmView === 'chart'" :players="R.players" :duration-ms="R.duration_ms" :gutter="gutter" :compact="xs" />
          <table v-else class="rows" style="max-width:480px">

            <tbody><tr v-for="(v, m) in R.players[0].apm_per_minute" :key="m">

            </tr></tbody>
          </table>
        </div>
      </div>

      <div class="panel mt-4">
        <div class="panel-head">

            <button v-for="k in KINDS" :key="k.k" class="chip" :class="kinds.includes(k.k) && 'on'" :aria-pressed="kinds.includes(k.k)" @click="toggleKind(k.k)">
              <v-icon v-if="kinds.includes(k.k)" size="16" icon="mdi-check" />{{ k.label }}
            </button>
          </span>
        </div>

        <div v-if="xs" class="panel-body pt-2">
          <v-tabs v-model="tab" density="compact" grow color="primary-text">
            <v-tab v-for="(p, i) in R.players" :key="p.player_id" :value="i">
              <span class="d-inline-flex align-center ga-2"><span class="key" :style="{ background: seriesColor(i) }"></span>
              <race-icon :race="p.race" :size="18" />{{ short(p.name) }}</span>
            </v-tab>
          </v-tabs>
          <hr class="rule">
          <div class="mt-2">
            <template v-for="e in listFor(R.players[tab].player_id)" :key="e.i">
              <div class="d-flex align-center ga-3" style="min-height:32px">
                <span class="muted small text-no-wrap" style="width:44px; flex:none">{{ fmt(e.t) }}</span>
                <obj-icon :code="e.code" :size="24" />
                <span class="small">{{ nameOf(e.code) }}</span>
              </div>
              <div v-if="e.skills.length" class="trail" style="padding-left:92px">
                <obj-icon v-for="s in e.skills" :key="s.t" :code="s.code" :size="20" :title="nameOf(s.code) + ' at ' + fmt(s.t)" />
              </div>
            </template>
          </div>
        </div>

        <table v-else class="rows bo">
          <thead><tr>
            <th style="text-align:right"><span class="d-inline-flex align-center ga-2">{{ R.players[0].name }}<race-icon :race="R.players[0].race" :size="18" /><span class="key" :style="{ background: seriesColor(0) }"></span></span></th>
            <th style="text-align:center">Time</th>
            <th><span class="d-inline-flex align-center ga-2"><span class="key" :style="{ background: seriesColor(1) }"></span>{{ R.players[1].name }}<race-icon :race="R.players[1].race" :size="18" /></span></th>
          </tr></thead>
          <tbody>
            <tr v-for="r in sharedRows" :key="r.t">
              <td>
                <template v-for="e in r.a" :key="e.i">
                  <div class="ev ev-l"><span>{{ nameOf(e.code) }}</span><obj-icon :code="e.code" :size="24" /></div>
                  <div v-if="e.skills.length" class="trail trail-l">
                    <obj-icon v-for="s in e.skills" :key="s.t" :code="s.code" :size="20" :title="nameOf(s.code) + ' at ' + fmt(s.t)" />
                  </div>
                </template>
              </td>
              <td class="t">{{ fmt(r.t) }}</td>
              <td>
                <template v-for="e in r.b" :key="e.i">
                  <div class="ev"><obj-icon :code="e.code" :size="24" /><span>{{ nameOf(e.code) }}</span></div>
                  <div v-if="e.skills.length" class="trail">
                    <obj-icon v-for="s in e.skills" :key="s.t" :code="s.code" :size="20" :title="nameOf(s.code) + ' at ' + fmt(s.t)" />
                  </div>
                </template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div v-if="R.chat.length" class="panel mt-4">
        <div class="panel-head"><h2>Chat</h2></div>
        <div class="panel-body py-3">
          <div v-for="c in R.chat" :key="c.time_ms" class="chat-row">
            <span class="muted">{{ fmt(c.time_ms) }}</span>
            <span class="pname">
              <span class="font-weight-medium">{{ player(c.player_id).name }}</span>
              <race-icon :race="player(c.player_id).race" :size="18" />
            </span>
            <span>{{ c.message }}</span>
          </div>
        </div>
      </div>
    </div>
    </template>
  </v-main>
</v-app>
</script>

const minuteTicks = (maxMin, plotW) => {
  const n = Math.max(2, Math.round(plotW / 90))
  const step = [1, 2, 5, 10, 15, 20, 30].find(s => maxMin / s <= n) || 60
  return d3.range(0, maxMin + 1e-9, step)
}
function useWidth(el, min = 280) {
  const w = ref(0); let ro
  onMounted(() => { ro = new ResizeObserver(([e]) => { w.value = Math.max(min, Math.floor(e.contentRect.width)) }); ro.observe(el.value) })
  onBeforeUnmount(() => ro && ro.disconnect())
  return w
}

const RaceIcon = {
  props: { race: String, size: { type: Number, default: 20 } },
  setup: p => ({ r: computed(() => RACES[p.race]) }),
  template: `<v-tooltip v-if="r" location="top" :text="r[0]"><template #activator="{ props }">
    <img v-bind="props" class="race" :src="'../../frontend/race-icons/' + r[1] + '.png'" :alt="r[0]" :style="{ width: size + 'px', height: size + 'px' }" /></template></v-tooltip>`,
}
const ObjIcon = {
  props: { code: String, size: { type: Number, default: 24 } },
  setup: p => ({ src: computed(() => iconSrc(p.code)), name: computed(() => nameOf(p.code)) }),
  template: `<img v-if="src" :src="src" :width="size" :height="size" :alt="name" class="obj" />
    <v-icon v-else :size="size" icon="mdi-help-box-outline" :aria-label="name" />`,
}

const ApmChart = {
  props: { players: Array, durationMs: Number, gutter: Number, compact: Boolean },
  setup(props) {
    const box = ref(null), gx = ref(null), gy = ref(null), hi = ref(null)
    const width = useWidth(box)
    const H = 200, T = 12, AX = 28
    const m = computed(() => props.compact ? { l: 36, r: 12 } : { l: props.gutter, r: 88 })
    const maxMin = props.durationMs / 60000
    const x = computed(() => d3.scaleLinear([0, maxMin], [m.value.l, width.value - m.value.r]))
    const y = computed(() => d3.scaleLinear().domain([0, d3.max(props.players.flatMap(p => p.apm_per_minute))]).nice().range([T + H, T]))
    const n = props.players[0].apm_per_minute.length
    const series = computed(() => props.players.map((p, i) => {
      const pts = p.apm_per_minute.map((v, k) => [x.value(k + 0.5), y.value(v)])
      return { p, i, d: d3.line()(pts), end: pts[pts.length - 1], color: seriesColor(i) }
    }))
    const endLabels = computed(() => {
      if (props.compact || width.value < 600) return []
      const e = series.value.map(s => s.end[1])
      return Math.abs(e[0] - e[1]) >= 16 ? series.value : []
    })
    watchEffect(() => {
      if (!gx.value || !width.value) return
      const w = width.value - m.value.l - m.value.r
      d3.select(gx.value).call(d3.axisBottom(x.value).tickValues(minuteTicks(maxMin, w)).tickFormat(d => d + ':00').tickSizeOuter(0))
      d3.select(gy.value).call(d3.axisLeft(y.value).ticks(4).tickSize(-w).tickSizeOuter(0)).call(g => g.select('.domain').remove())
    }, { flush: 'post' })
    const move = e => {
      const px = e.clientX - e.currentTarget.getBoundingClientRect().left
      hi.value = Math.max(0, Math.min(n - 1, Math.round(x.value.invert(px) - 0.5)))
    }
    const key = e => {
      if (e.key === 'ArrowRight') hi.value = Math.min(n - 1, (hi.value ?? -1) + 1)
      else if (e.key === 'ArrowLeft') hi.value = Math.max(0, (hi.value ?? n) - 1)
    }
    const tip = computed(() => {
      if (hi.value == null) return null
      const cx = x.value(hi.value + 0.5)
      const left = cx + 180 > width.value ? cx - 172 : cx + 12
      const rows = series.value.map(s => ({ ...s, v: s.p.apm_per_minute[hi.value] })).sort((a, b) => b.v - a.v)
      return { cx, left, rows, label: `Minute ${hi.value + 1}` }
    })
    return { box, gx, gy, hi, width, H, T, AX, m, x, y, series, endLabels, move, key, tip, short }
  },
  template: `<div ref="box" class="chart-box">
    <svg v-if="width" :width="width" :height="T + H + AX" tabindex="0" role="img" aria-label="APM per minute, both players"
      @pointermove="move" @pointerleave="hi = null" @keydown="key" @blur="hi = null" style="display:block; touch-action:pan-y">
      <g ref="gy" class="axis" :transform="'translate(' + m.l + ',0)'" />
      <g ref="gx" class="axis" :transform="'translate(0,' + (T + H) + ')'" />
      <line v-if="tip" :x1="tip.cx" :x2="tip.cx" :y1="T" :y2="T + H" style="stroke: var(--faint)" />
      <path v-for="s in series" :key="s.i" :d="s.d" fill="none" :style="{ stroke: s.color }" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      <circle v-for="s in series" :key="'e' + s.i" :cx="s.end[0]" :cy="s.end[1]" r="4" :style="{ fill: s.color, stroke: 'var(--surface)' }" stroke-width="2" />
      <template v-if="tip"><circle v-for="s in tip.rows" :key="'h' + s.i" :cx="tip.cx" :cy="y(s.v)" r="4.5" :style="{ fill: s.color, stroke: 'var(--surface)' }" stroke-width="2" /></template>
      <text v-for="s in endLabels" :key="'l' + s.i" :x="s.end[0] + 10" :y="s.end[1] + 4" font-size="13" style="fill: var(--secondary)">{{ short(s.p.name) }}</text>
    </svg>
    <div v-if="tip" class="tip" :style="{ left: tip.left + 'px', top: '8px' }">
      <div class="muted mb-1">{{ tip.label }}</div>
      <div v-for="s in tip.rows" :key="s.i" class="tip-row"><span class="key" :style="{ background: s.color }"></span>
        <b>{{ s.v }}</b><span>{{ s.p.name }}</span></div>
    </div>
  </div>`,
}

const App = {
  template: '#app-tpl',
  setup() {
    const { xs } = Vuetify.useDisplay()
    const kinds = ref(KINDS.map(k => k.k))
    const toggleKind = k => { kinds.value = kinds.value.includes(k) ? kinds.value.filter(x => x !== k) : [...kinds.value, k] }
    const apmView = ref('chart')
    const tab = ref(0)
    const gutter = 88
    const shownEvents = computed(() => EV.filter(e => kinds.value.includes(e.k === 's' ? 'h' : e.k)))
    // skill rows nest under their hero_trained row (docs/design/frontend.md 12.2)
    const withSkills = e => ({ ...e, skills: e.k === 'h' ? skillsOf(e.p, e.code) : [] })
    const listFor = p => shownEvents.value.filter(e => e.p === p && e.k !== 's').map(withSkills)
    const sharedRows = computed(() => {
      const rows = new Map()
      shownEvents.value.filter(e => e.k !== 's').forEach(e => {
        if (!rows.has(e.t)) rows.set(e.t, { t: e.t, a: [], b: [] })
        rows.get(e.t)[e.p === R.players[0].player_id ? 'a' : 'b'].push(withSkills(e))
      })
      return [...rows.values()]
    })
    const player = id => R.players.find(p => p.player_id === id)
    return { R, STATE, KINDS, xs, kinds, toggleKind, apmView, tab, gutter, shownEvents, listFor, sharedRows, player,
      fmt, short, nameOf, seriesColor, skillsOf }
  },
}

createApp(App)
  .component('race-icon', RaceIcon).component('obj-icon', ObjIcon)
  .component('apm-chart', ApmChart).component('theme-menu', gnlMockup.ThemeMenu)
  .use(gnlMockup.vuetify())
  .mount('#app')
</script>
</body>
</html>
