<style>
/* Vuetify onto the GNL type (frontend.md 6.3, F14); colours come from the theme (theme.js) */
.v-application, .v-btn, .v-field, .v-label, .v-list-item-title, .v-list-item-subtitle, .v-table, .v-expansion-panel-title, .v-alert, .v-tooltip > .v-overlay__content { font-family: var(--font-body) !important; letter-spacing: normal !important; }
.v-btn { text-transform: none; font-weight: 500; }
.v-table > .v-table__wrapper > table > thead > tr > th { color: var(--muted); font-size: 14px; font-weight: 500; }
.v-table > .v-table__wrapper > table > tbody > tr:hover > td { background: var(--surface-light); }
.v-tooltip > .v-overlay__content { border-radius: var(--radius); font-size: 13px; }
.bar a { color: inherit; }
.bar .navlink.on { color: var(--on-surface); }
.page { max-width: 1280px; margin: 0 auto; }

.filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.filter-row .f-race { width: 176px; }
.filter-row .f-wide { width: 220px; }
.filter-row .f-min { width: 88px; }
.filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.slot-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
.steps { list-style: none; margin: 0; padding: 0 8px; }
.step + .step { border-top: 1px solid var(--border); }
.step-line { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 2px 4px; }
.step-no { width: 16px; text-align: right; flex: none; }
.step-obj { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; background: none; border: 0; padding: 4px; border-radius: var(--radius); color: inherit; font: inherit; cursor: pointer; text-align: left; }
.step-obj:hover, .step-obj:focus-visible { background: var(--surface-light); outline: none; }
.step-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-timing { white-space: nowrap; flex: none; }
.timing-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 4px 8px 12px 32px; }
.obj-icon { display: block; border-radius: var(--radius); flex: none; }

.picker { border-top: 1px solid var(--border); padding: 12px 16px 16px; }
.picker .v-tab.v-btn { min-width: 0; padding: 0 12px; }
.picker-grid {display: grid; grid-template-columns: repeat(auto-fill, 44px); gap: 6px; max-height: 232px; overflow-y: auto; padding-top: 10px; }
.picker-grid .grid-head { grid-column: 1 / -1; padding-top: 6px; }
.cell { width: 44px; height: 44px; padding: 2px; border: 0; border-radius: var(--radius); background: none; cursor: pointer; }
.cell img { width: 40px; height: 40px; display: block; border-radius: var(--radius); }
.cell:hover, .cell:focus-visible { outline: 2px solid var(--primary); outline-offset: 0; }

.pname { white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.result-cell { white-space: nowrap; }
.players-cell { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.state-block { padding: 32px 16px; text-align: center; }

.m-row { display: flex; align-items: center; gap: 4px; padding: 10px 4px 10px 12px; color: inherit; text-decoration: none; }
.m-row + .m-row { border-top: 1px solid var(--border); }
.m-main { flex: 1 1 auto; min-width: 0; color: inherit; text-decoration: none; }
.m-line1 { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 2px; }
.m-line2 { display: flex; gap: 12px; margin-top: 2px; }

.search-bar { display: flex; justify-content: flex-end; }
</style>

const TOTAL = STATE === 'empty' ? 0 : 62;
// api.md 3.4, 400 table: a pasted link put ~30 on step 1
const STEP_ERROR = 'groups[0].steps[0].within_previous_seconds: not allowed on the first step';

const KINDS = [['building', 'Buildings'], ['unit', 'Units'], ['upgrade', 'Upgrades'], ['hero', 'Heroes'], ['hero_skill', 'Skills'], ['item', 'Items']];

const RaceIcon = {
  props: { race: String, size: { type: [String, Number], default: '1.4em' } },
  setup: (p) => ({ RACES, raceIcon, dim: computed(() => (isNaN(p.size) ? p.size : p.size + 'px')) }),
  template: `<v-tooltip v-if="race && RACES[race]" location="top" :text="RACES[race][0]">
    <template #activator="{ props }"><img v-bind="props" :src="raceIcon(race)" :alt="RACES[race][0]" :style="{ width: dim, height: dim, display: 'inline-block', flex: 'none' }"></template>
  </v-tooltip>`,
};

const PlayerName = {
  props: { name: String, race: String, strong: Boolean },
  template: `<span class="pname" :class="strong ? 'font-weight-bold' : 'muted'"><span>{{ name }}</span><race-icon :race="race" /></span>`,
};

const ObjectIcon = {
  props: { code: String, size: { type: Number, default: 28 } },
  setup: () => ({ iconUrl }),
  template: `<img v-if="iconUrl(code)" class="obj-icon" :src="iconUrl(code)" :width="size" :height="size" alt="">
    <v-icon v-else :size="size">mdi-help-box-outline</v-icon>`,
};

const RaceSelect = {
  props: { modelValue: String, label: String },
  emits: ['update:modelValue'],
  setup: () => ({ RACE_ITEMS }),
  template: `<v-select :model-value="modelValue" @update:model-value="$emit('update:modelValue', $event)" :items="RACE_ITEMS" :label="label"
      clearable hide-details>
    <template #selection="{ item }"><span class="d-inline-flex align-center ga-2"><race-icon :race="item.value" size="20" />{{ item.title }}</span></template>
    <template #item="{ props, item }"><v-list-item v-bind="props"><template #prepend><span class="d-inline-flex mr-3"><race-icon :race="item.value" size="20" /></span></template></v-list-item></template>
  </v-select>`,
};

const ObjectPicker = {
  props: { race: String },
  emits: ['pick'],
  setup(props) {
    const q = ref('');
    const tab = ref('building');
    const fits = o => !props.race || o.race === props.race || o.race == null;
    const all = Object.values(OBJ);
    const groups = computed(() => {
      if (q.value.trim()) {
        const t = q.value.trim().toLowerCase();
        return [{ title: null, items: all.filter(o => fits(o) && o.name.toLowerCase().includes(t)).slice(0, 48) }];
      }
      const list = all.filter(o => o.kind === tab.value && fits(o));
      if (tab.value === 'hero_skill') {
        const by = {};
        list.forEach(o => { (by[o.hero || 'Other'] ||= []).push(o); });
        return Object.entries(by).map(([title, items]) => ({ title, items }));
      }
      if (tab.value === 'item') return [{ title: null, items: list }];
      const own = list.filter(o => o.race === props.race), neutral = list.filter(o => o.race == null);
      return [{ title: null, items: props.race ? own : list }, ...(props.race && neutral.length ? [{ title: 'Neutral', items: neutral }] : [])];
    });
    return { q, tab, groups, KINDS, iconUrl };
  },
  template: `<div class="picker">
    <v-text-field v-model="q" prepend-inner-icon="mdi-magnify" placeholder="Search by name" hide-details autofocus />
    <v-tabs v-model="tab" density="compact" show-arrows class="mt-2" color="primary">
      <v-tab v-for="[k, t] in KINDS" :key="k" :value="k" size="small">{{ t }}</v-tab>
    </v-tabs>
    <div class="picker-grid">
      <template v-for="g in groups" :key="g.title || 'main'">
        <div v-if="g.title" class="grid-head small muted">{{ g.title }}</div>
        <v-tooltip v-for="o in g.items" :key="o.code" :text="o.name" location="top">
          <template #activator="{ props }">
            <button v-bind="props" class="cell" :aria-label="o.name" @click="$emit('pick', o.code)"><img :src="iconUrl(o.code)" alt=""></button>
          </template>
        </v-tooltip>
      </template>
    </div>
  </div>`,
};

const App = {
  setup() {
    const { smAndDown, mdAndUp } = useDisplay();
    const filters = reactive({ race: 'N', opponent_race: 'O', map: null, player: null, min: '', max: '' });
    const setCount = computed(() => Object.values(filters).filter(v => v !== null && v !== '').length);
    const slots = reactive([
      { label: 'Player 1', result: 'any', picking: !smAndDown.value, steps: [
        { code: 'eate', from: '', to: '0:30', within: STATE === 'error' ? '30' : '', open: STATE === 'error' },
        { code: 'eaom', from: '', to: '', within: '30', open: true },
        { code: 'Edem', from: '', to: '3:00', within: '', open: false },
      ] },
      { label: 'Player 2', result: 'any', player: null, picking: false, steps: [
        { code: 'Ofar', from: '', to: '3:00', within: '', open: false },
      ] },
    ]);
    const slotRace = i => (i === 0 ? filters.race : filters.opponent_race);
    const hasTiming = s => !!(s.from || s.to || s.within);
    const timingText = (s, i) => {
      const parts = [];
      if (s.within && i > 0) parts.push(`within ${s.within} s`);
      if (s.from && s.to) parts.push(`${s.from} to ${s.to}`);
      else if (s.to) parts.push(`by ${s.to}`);
      else if (s.from) parts.push(`from ${s.from}`);
      return parts.join(', ');
    };
    const pick = (slot, code) => { slot.steps.push({ code, from: '', to: '', within: '', open: false }); slot.picking = false; };
    const stepError = (si, i) => (STATE === 'error' && si === 0 && i === 0 ? 'Not allowed on the first step' : undefined);
    // api.md 2.4: one fixed order; every gnl_series_id is 0 today, so replay_id decides
    const rows = ROWS.slice().sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([id, dur, win, map, focus, ps], i) => {
      const players = ps.map(([pid, name, race, team]) => ({ pid, name, race, won: team === win }));
      const f = players.find(p => p.pid === focus);
      players.sort((a, b) => (a === f ? -1 : b === f ? 1 : 0)); // frontend.md 8.2: focus player first
      // api.md 2.5: download_url is null when no file is known; the row shows "No file"
      return { id, duration: dur, map: mapName(map), matchup: [f.race, players.find(p => p !== f).race], players, won: f.won, file: i % 6 === 5 ? null : '#', detail: `replay-detail.html?id=${id}` };
    });
    const headers = [
      { title: 'Map', key: 'map', sortable: false },
      { title: 'Matchup', key: 'matchup', sortable: false },
      { title: 'Players', key: 'players', sortable: false },
      { title: 'Length', key: 'duration', align: 'end', sortable: false },
      { title: 'Result', key: 'won', sortable: false },
      { title: 'File', key: 'file', sortable: false, align: 'center' },
      { title: '', key: 'open', sortable: false, align: 'end', width: 48 },
    ];
    const go = (_, { item }) => { location.href = item.detail; };
    return { smAndDown, mdAndUp, filters, setCount, slots, slotRace, hasTiming, timingText, pick, OBJ,
      MAPS, PLAYERS, TOTAL, STATE, STEP_ERROR, stepError, rows, headers, go, mss, raceIcon };
  },
  template: `<v-app>
  <header class="bar">
    <a class="brand" href="build-order-search.html">GNL replays</a>
    <nav class="d-flex ga-6">
      <a class="navlink on" href="build-order-search.html" aria-current="page">Search</a><a class="navlink" href="openers-tree.html">Openers</a><a class="navlink" href="stats.html">Stats</a>
    </nav>
    <theme-menu class="push"></theme-menu>
  </header>
  <v-main>
    <div class="page px-4 py-5">
      <!-- filter row -->
      <div v-if="mdAndUp" class="filter-row mb-5">
        <race-select v-model="filters.race" label="Race" class="f-race" />
        <race-select v-model="filters.opponent_race" label="Opponent race" class="f-race" />
        <v-autocomplete v-model="filters.map" :items="MAPS" item-props label="Map" clearable hide-details class="f-wide" />
        <v-autocomplete v-model="filters.player" :items="PLAYERS" label="Player" clearable hide-details class="f-wide" />
        <v-text-field v-model="filters.min" label="Min min" type="number" hide-details class="f-min" />
        <v-text-field v-model="filters.max" label="Max min" type="number" hide-details class="f-min" />
        <v-btn v-if="setCount" variant="text" @click="Object.assign(filters, { race: null, opponent_race: null, map: null, player: null, min: '', max: '' })">Clear</v-btn>
      </div>
      <v-expansion-panels v-else class="mb-4" variant="accordion">
        <v-expansion-panel elevation="0" class="border">
          <v-expansion-panel-title>
            <span class="mr-3">Filters</span>
            <span class="tag num mr-3">{{ setCount }}</span>
            <race-icon v-if="filters.race" :race="filters.race" size="20" class="mr-1" />
            <span v-if="filters.opponent_race" class="small muted mx-1">v</span>
            <race-icon v-if="filters.opponent_race" :race="filters.opponent_race" size="20" />
          </v-expansion-panel-title>
          <v-expansion-panel-text>
            <div class="filter-grid">
              <race-select v-model="filters.race" label="Race" />
              <race-select v-model="filters.opponent_race" label="Opponent race" />
              <v-autocomplete v-model="filters.map" :items="MAPS" item-props label="Map" clearable hide-details />
              <v-autocomplete v-model="filters.player" :items="PLAYERS" label="Player" clearable hide-details />
              <v-text-field v-model="filters.min" label="Min min" type="number" hide-details />
              <v-text-field v-model="filters.max" label="Max min" type="number" hide-details />
            </div>
          </v-expansion-panel-text>
        </v-expansion-panel>
      </v-expansion-panels>

      <!-- player slots -->
      <v-row dense>
        <v-col v-for="(slot, si) in slots" :key="si" cols="12" md="6">
          <v-card flat border>
            <div class="slot-head">
              <race-icon :race="slotRace(si)" size="26" />
              <h3>{{ slot.label }}</h3>
              <v-spacer />
              <v-btn-toggle v-model="slot.result" mandatory divided variant="outlined" density="compact" color="primary">
                <v-btn value="won" size="small">Won</v-btn><v-btn value="lost" size="small">Lost</v-btn><v-btn value="any" size="small">Any</v-btn>
              </v-btn-toggle>
            </div>
            <div v-if="si === 1" class="px-4 pb-2">
              <v-autocomplete v-model="slot.player" :items="PLAYERS" label="Player 2 name" clearable hide-details />
            </div>
            <ol class="steps">
              <li v-for="(s, i) in slot.steps" :key="i" class="step">
                <div class="step-line">
                  <span class="step-no small muted num">{{ i + 1 }}</span>
                  <button class="step-obj" :aria-label="'Change step ' + (i + 1) + ': ' + OBJ[s.code].name">
                    <object-icon :code="s.code" :size="28" />
                    <span class="d-flex flex-column" style="min-width: 0">
                      <span class="step-name">{{ OBJ[s.code].name }}</span>
                      <span v-if="smAndDown && timingText(s, i)" class="small muted">{{ timingText(s, i) }}</span>
                    </span>
                  </button>
                  <span v-if="!smAndDown" class="step-timing small muted num">{{ timingText(s, i) }}</span>
                  <v-btn icon size="small" :variant="hasTiming(s) ? 'tonal' : 'text'" :color="hasTiming(s) ? 'primary' : undefined"
                    :aria-label="'Timing for step ' + (i + 1)" :aria-expanded="s.open" @click="s.open = !s.open"><v-icon size="18">mdi-clock-outline</v-icon></v-btn>
                  <v-btn icon size="small" variant="text" :aria-label="'Remove step ' + (i + 1)" @click="slot.steps.splice(i, 1)"><v-icon size="18">mdi-close</v-icon></v-btn>
                </div>
                <div v-if="s.open" class="timing-row" :style="smAndDown ? { gridTemplateColumns: '1fr', paddingLeft: '28px' } : null">
                  <v-text-field v-model="s.within" label="Within previous (s)" :disabled="i === 0 && !s.within" inputmode="numeric"
                    :error-messages="stepError(si, i)" :hide-details="!stepError(si, i)" />
                  <v-text-field v-model="s.from" label="Not before (m:ss)" hide-details />
                  <v-text-field v-model="s.to" label="Not after (m:ss)" hide-details />
                </div>
              </li>
            </ol>
            <div class="px-3 py-2">
              <v-btn v-if="slot.steps.length < 8" variant="text" prepend-icon="mdi-plus" :active="slot.picking" @click="slot.picking = !slot.picking">Add step</v-btn>
            </div>
            <object-picker v-if="slot.picking" :race="slotRace(si)" @pick="pick(slot, $event)" />
          </v-card>
        </v-col>
      </v-row>
      <div class="search-bar mt-3">
        <v-btn color="primary" size="large" prepend-icon="mdi-magnify" :block="smAndDown" flat>Search</v-btn>
      </div>

      <!-- results -->
      <v-alert v-if="STATE === 'error'" type="error" variant="tonal" density="compact" class="mt-6" style="overflow-wrap: anywhere">{{ STEP_ERROR }}</v-alert>
      <div v-else-if="STATE !== 'offline'" class="mt-6 mb-3">
        <h2>{{ TOTAL }} games</h2>
      </div>

      <v-card v-if="STATE === 'offline'" flat border class="state-block mt-6">
        <h3 class="mb-3">Warehouse offline</h3>
        <v-btn variant="tonal" prepend-icon="mdi-refresh">Retry</v-btn>
      </v-card>
      <v-card v-else-if="STATE === 'empty'" flat border class="state-block">No game matches. Drop a step or widen the filters.</v-card>
      <v-card v-else-if="STATE !== 'error'" flat border>
        <v-data-table-server v-if="mdAndUp" :headers="headers" :items="rows" :items-length="TOTAL" :items-per-page="25"
          density="compact" hover item-value="id" @click:row="go">
          <template #item.matchup="{ item }"><span class="d-inline-flex align-center ga-1"><race-icon :race="item.matchup[0]" /><span class="small muted">v</span><race-icon :race="item.matchup[1]" /></span></template>
          <template #item.players="{ item }">
            <div class="players-cell"><player-name v-for="p in item.players" :key="p.pid" :name="p.name" :race="p.race" :strong="p.won" /></div>
          </template>
          <template #item.duration="{ item }"><span class="num">{{ mss(item.duration / 1000) }}</span></template>
          <template #item.won="{ item }"><span class="result-cell"><span class="dot" :style="{ background: item.won ? 'var(--win)' : 'var(--loss)' }"></span>{{ item.won ? 'Won' : 'Lost' }}</span></template>
          <template #item.file="{ item }"><v-btn v-if="item.file" icon size="small" variant="text" :href="item.file" aria-label="Download .w3g" @click.stop><v-icon size="20">mdi-download</v-icon></v-btn><span v-else class="small muted text-no-wrap">No file</span></template>
          <template #item.open="{ item }"><v-btn icon size="small" variant="text" :href="item.detail" aria-label="Open replay" @click.stop><v-icon size="20">mdi-chevron-right</v-icon></v-btn></template>
        </v-data-table-server>
        <template v-else>
          <div v-for="r in rows" :key="r.id" class="m-row">
            <a class="m-main" :href="r.detail">
              <div class="m-line1"><player-name v-for="p in r.players" :key="p.pid" :name="p.name" :race="p.race" :strong="p.won" /></div>
              <div class="m-line2 small muted">
                <span>{{ r.map }}</span><span class="num">{{ mss(r.duration / 1000) }}</span>
                <span class="result-cell"><span class="dot" :style="{ background: r.won ? 'var(--win)' : 'var(--loss)' }"></span>{{ r.won ? 'Won' : 'Lost' }}</span>
              </div>
            </a>
            <v-btn v-if="r.file" icon size="small" variant="text" :href="r.file" aria-label="Download .w3g"><v-icon size="20">mdi-download</v-icon></v-btn>
            <span v-else class="small muted text-no-wrap px-2">No file</span>
          </div>
          <div class="d-flex align-center justify-end ga-2 px-3 py-2 border-t">
            <span class="small muted num">1-25 of {{ TOTAL }}</span>
            <v-btn icon size="small" variant="text" disabled aria-label="Previous page"><v-icon>mdi-chevron-left</v-icon></v-btn>
            <v-btn icon size="small" variant="text" aria-label="Next page"><v-icon>mdi-chevron-right</v-icon></v-btn>
          </div>
        </template>
      </v-card>
    </div>
  </v-main>
</v-app>`,
};

createApp(App)
  .component('RaceIcon', RaceIcon).component('PlayerName', PlayerName).component('ObjectIcon', ObjectIcon)
  .component('RaceSelect', RaceSelect).component('ObjectPicker', ObjectPicker).component('ThemeMenu', gnlMockup.ThemeMenu)
  .use(gnlMockup.vuetify()).mount('#app');
</script>
</body>
</html>
