<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Openers tree</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3.8.0/dist/vuetify.min.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vuetify@3.8.0/dist/vuetify.min.js"></script>
<script src="./theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<link rel="stylesheet" href="./tokens.css">
<style>
  /* gnl base.css: no upper-case buttons */
  .v-btn { text-transform: none; letter-spacing: normal; }
  .v-badge__badge { font-family: var(--font-body); }
  .v-application, .v-field, .v-list-item-title, .v-list-item-subtitle, .v-table, .v-expansion-panel-title { font-family: var(--font-body); }
  /* Vuetify parts to the GNL shapes (frontend.md 6.2); colours come from the theme (theme.js) */
  .v-table > .v-table__wrapper > table > thead > tr > th { color: var(--muted); font-size: 14px; font-weight: 500; }
  .v-tooltip > .v-overlay__content { border-radius: var(--radius); font-size: 13px; }
  .v-dialog > .v-overlay__content > .v-card { border-radius: var(--radius); }
  .v-overlay__content:focus-visible { outline: none; } /* Vuetify focuses the dialog box itself; its controls keep the ring */
  .seg { display: flex; gap: 0; }
  .seg .chip { border-radius: 0; margin-left: -1px; }
  .seg .chip:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
  .seg .chip:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .seg .chip.on { position: relative; }
  .page { max-width: 1400px; margin: 0 auto; padding: 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .filters .f-race { width: 190px; }
  .filters .f-map { width: 210px; }
  .filters .f-player { width: 220px; }
  .filters .f-min { width: 108px; }
  .filters-mobile { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .filters-mobile .wide { grid-column: 1 / -1; }

  .card { border: 1px solid var(--border); }

  /* the tree table */
  .tree th { white-space: nowrap; }
  .tree td { height: 44px !important; }
  .tree tr.node { cursor: pointer; }
  .tree tr.node:hover td { background: var(--surface-light); }
  .tree .tag { height: 20px; padding: 0 6px; font-size: 12px; flex: none; }
  .opener { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .opener .chev { width: 20px; flex: none; }
  .opener .icons { display: flex; gap: 2px; flex: none; align-items: center; }
  .opener .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .obj { display: block; border-radius: 2px; }
  .obj.dim { opacity: 0.38; }
  .stopped { color: var(--muted); font-style: italic; }
  .cell-mark { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .cell-mark .v { min-width: 3.2em; text-align: right; }
  .stack { flex-direction: column; align-items: flex-end; gap: 2px; }

  /* inline marks */
  .track { stroke: var(--border); stroke-width: 1; }
  .mid { stroke: var(--faint); stroke-width: 1; }
  .s1 { fill: var(--magnitude); } /* one-series magnitude (frontend.md 6.5) */
  .win { fill: var(--win); }
  .loss { fill: var(--loss); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .dot.win { background: var(--win); }
  .dot.loss { background: var(--loss); }

  .state-block { padding: 48px 16px; text-align: center; }
  .race-pick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 16px; }
  .race-pick .v-btn { border-color: var(--border); color: var(--secondary); font-size: 15px; }

  /* replay rows (ReplayTable, narrow form) */
  .rep { display: flex; align-items: center; gap: 8px; padding: 8px 16px; cursor: pointer;
    border-top: 1px solid var(--border); color: inherit; text-decoration: none; }
  .rep:hover { background: var(--surface-light); }
  .rep .main { flex: 1; min-width: 0; }
  .rep .players { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 15px; }
  .rep .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-top: 2px; align-items: center; }
  .rep .meta .res { color: var(--on-surface); }
  .pn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pn img { width: 1.4em; height: 1.4em; }
  @media (max-width: 599px) {
    .page { padding: 12px 12px; }
    .tree td, .tree th { padding: 0 6px !important; }
    .tree td:first-child, .tree th:first-child { padding-left: 8px !important; }
    .race-pick { grid-template-columns: 1fr 1fr; }
    .tree td { height: 52px !important; }
    .pname { font-size: 0.75rem; line-height: 1.2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    .rep .players.col { flex-direction: column; align-items: flex-start; gap: 2px; }
    .vs { width: 1.4em; text-align: center; margin-right: -2px; font-weight: 400; }
    .rep { padding: 8px 12px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
const { createApp, ref, reactive, computed, watch } = Vue
const { useDisplay } = Vuetify
const D = window.DATA
// mockup-only state switch: ?state=norace | empty | offline | replays (frontend.md 10.2, 10.4, 5.2)
const STATE = new URLSearchParams(location.search).get('state')

const RACES = [
  { id: 'HU', name: 'Human', icon: '../../frontend/race-icons/HUMAN.png' },
  { id: 'OC', name: 'Orc', icon: '../../frontend/race-icons/ORC.png' },
  { id: 'NE', name: 'Night Elf', icon: '../../frontend/race-icons/NIGHT_ELF.png' },
  { id: 'UD', name: 'Undead', icon: '../../frontend/race-icons/UNDEAD.png' },
  { id: 'RANDOM', name: 'Random', icon: '../../frontend/race-icons/RANDOM.png' },
]
const raceOf = (id) => RACES.find((r) => r.id === id)
const FLOOR = 10 // api.md 3.5 win_rate_floor
const MAX_DEPTH = 6
const ICONS = ref({})
fetch('../../frontend/icons.json').then((r) => r.json()).then((j) => (ICONS.value = j)).catch(() => {})

// one player-game per row: [race, seq as code indices, opp race, map, player, opponent, won, seconds, replay id, player id]
const ROWS = D.rows.map((r) => ({
  race: r[0], seq: r[1].split('.').map((i) => D.codes[+i]), opp: r[2], map: D.maps[r[3]],
  player: D.players[r[4]], oppName: D.players[r[5]], won: r[6], dur: r[7], id: r[8], pid: r[9],
}))
const nameOf = (code) => D.names[code] || code
const fmt = (n) => n.toLocaleString('en-US')
const pct = (x) => Math.round(x * 100) + '%' // fmtPct (frontend.md 13)
const mss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')

const ObjIcon = {
  props: { code: String, size: { type: Number, default: 28 }, dim: Boolean },
  setup(p) { return { ICONS, nameOf } },
  template: `
    <img v-if="ICONS[code]" class="obj" :class="{ dim }" :src="'../../frontend/icons/' + ICONS[code]"
      :width="size" :height="size" :alt="nameOf(code)" :title="nameOf(code)">
    <v-icon v-else :size="size" :class="{ 'obj': true, dim }" :title="nameOf(code)">mdi-help-box-outline</v-icon>`,
}

const RaceIcon = {
  props: { race: String, size: { type: [String, Number], default: '1.4em' } },
  setup(p) { return { r: computed(() => raceOf(p.race)) } },
  template: `<v-tooltip v-if="r" location="top" :text="r.name"><template #activator="{ props }">
    <img v-bind="props" :src="r.icon" :alt="r.name" :style="{ width: typeof size === 'number' ? size + 'px' : size, height: typeof size === 'number' ? size + 'px' : size, display: 'block', flex: 'none' }"></template></v-tooltip>`,
}

// share of the parent's player-games, 64 px (frontend.md 10.3)
const ShareBar = {
  props: { games: Number, total: Number },
  setup(p) {
    const x = computed(() => d3.scaleLinear([0, p.total || 1], [0, 64]))
    return { x }
  },
  template: `<svg width="64" height="10" aria-hidden="true">
    <line class="track" x1="0" x2="64" y1="5" y2="5"/>
    <rect class="s1" x="0" y="2" height="6" rx="2" :width="Math.max(2, x(games))"/></svg>`,
}

// win rate on [0, 1] in the win colour only (D10), a tick at 50 %, 64 px (frontend.md 10.4)
const WinMark = {
  props: { wins: Number, games: Number },
  setup(p) { return { w: computed(() => Math.max(2, 64 * p.wins / p.games)) } },
  template: `<svg width="64" height="10" aria-hidden="true">
    <line class="track" x1="0" x2="64" y1="5" y2="5"/>
    <rect class="win" x="0" y="2" height="6" rx="2" :width="w"/>
    <line class="mid" x1="32" x2="32" y1="0" y2="10"/></svg>`,
}

const App = {
  components: { ObjIcon, RaceIcon, ShareBar, WinMark },
  setup() {
    const display = useDisplay()
    const mobile = computed(() => display.smAndDown.value)
    const phone = computed(() => display.xs.value)

    const f = reactive({ race: STATE === 'norace' ? null : 'NE', opponent_race: null, map: null, player: null, min_minutes: STATE === 'empty' ? 120 : null, max_minutes: null })
    const sort = ref('popular')
    const open = ref([])
    const dialogRow = ref(null)
    const dialogOpen = ref(false)
    const page = ref(1)
    const PER_PAGE = 10

    const cohort = computed(() => {
      if (STATE === 'empty') return []
      const lo = f.min_minutes === '' || f.min_minutes == null ? null : f.min_minutes * 60
      const hi = f.max_minutes === '' || f.max_minutes == null ? null : f.max_minutes * 60
      return ROWS.filter((r) => r.race === f.race
        && (!f.opponent_race || r.opp === f.opponent_race)
        && (!f.map || r.map === f.map)
        && (!f.player || r.player === f.player)
        && (lo == null || r.dur >= lo) && (hi == null || r.dur <= hi))
    })
    const raceRows = computed(() => ROWS.filter((r) => r.race === f.race))
    const mapItems = computed(() => {
      const c = d3.rollup(raceRows.value, (v) => v.length, (r) => r.map)
      return [...c].sort((a, b) => b[1] - a[1]).map(([m, n]) => ({ title: m, value: m, n }))
    })
    const playerItems = computed(() => {
      const c = d3.rollup(raceRows.value, (v) => v.length, (r) => r.player)
      return [...c].sort((a, b) => b[1] - a[1]).map(([p, n]) => ({ title: p, value: p, n }))
    })

    // one level of the tree, as GET /openers?prefix=... answers it (api.md 3.5)
    let cache = new Map()
    watch([cohort, sort], () => { cache = new Map() })
    function level(prefix) {
      const key = prefix.join('.') + '|' + sort.value
      if (cache.has(key)) return cache.get(key)
      const d = prefix.length
      const src = d ? level(prefix.slice(0, -1)).rows.find((r) => r.code === prefix[d - 1])?.rows || [] : cohort.value
      const groups = new Map()
      let stopped = 0
      for (const r of src) {
        const c = r.seq[d]
        if (!c) { stopped++; continue }
        let g = groups.get(c)
        if (!g) groups.set(c, (g = { code: c, games: 0, wins: 0, dur: 0, next: new Set(), rows: [] }))
        g.games++; g.wins += r.won; g.dur += r.dur; g.rows.push(r)
        if (r.seq[d + 1]) g.next.add(r.seq[d + 1])
      }
      const rows = [...groups.values()].map((g) => ({
        code: g.code, path: [...prefix, g.code], key: [...prefix, g.code].join('.'), depth: d + 1,
        games: g.games, wins: g.wins, rate: g.wins / g.games, avg: g.dur / g.games / 60,
        branches: d + 1 >= MAX_DEPTH ? 0 : g.next.size, rows: g.rows,
      }))
      const byCode = (a, b) => (a.code < b.code ? -1 : 1)
      rows.sort(sort.value === 'popular'
        ? (a, b) => b.games - a.games || b.rate - a.rate || byCode(a, b)
        : (a, b) => (b.games >= FLOOR) - (a.games >= FLOOR) || b.rate - a.rate || b.games - a.games || byCode(a, b))
      const out = { total: src.length, stopped, rows }
      cache.set(key, out)
      return out
    }

    const tableRows = computed(() => {
      cohort.value; sort.value
      const out = []
      const walk = (prefix) => {
        const L = level(prefix)
        for (const r of L.rows) {
          out.push({ type: 'node', ...r, parentTotal: L.total, isOpen: open.value.includes(r.key) })
          if (open.value.includes(r.key) && r.branches > 0) {
            walk(r.path)
            const c = level(r.path)
            if (c.stopped) out.push({ type: 'stop', key: r.key + '|stop', depth: r.depth + 1, path: r.path, games: c.stopped, parentTotal: c.total })
          }
        }
      }
      walk([])
      return out
    })

    // GET /openers/replays?prefix=... (api.md 3.6): one row per opener owner, so the count equals the row's games
    const replays = computed(() => {
      if (!dialogRow.value) return []
      // api.md 2.4: one fixed order; gnl ids are 0 today, so replay_id, then the owner
      return [...dialogRow.value.rows].sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : a.pid - b.pid))
    })
    const pages = computed(() => Math.max(1, Math.ceil(replays.value.length / PER_PAGE)))
    const pageRows = computed(() => replays.value.slice((page.value - 1) * PER_PAGE, page.value * PER_PAGE))
    watch(dialogRow, () => { page.value = 1 })

    function defaultPath() {
      const a = level([]).rows[0]
      const b = a && level(a.path).rows[0]
      const c = b && level(b.path).rows[0]
      open.value = [a, b].filter(Boolean).map((r) => r.key)
      return c || b || a
    }
    watch(() => f.race, () => { cache = new Map(); defaultPath() })
    const first = defaultPath()

    function toggle(row) {
      if (!row.branches) return
      if (row.isOpen) open.value = open.value.filter((k) => k !== row.key && !k.startsWith(row.key + '.'))
      else open.value = [...open.value, row.key]
    }
    function showReplays(row) { dialogRow.value = row; dialogOpen.value = true }
    if (STATE === 'replays' && first) showReplays(first)
    const headers = [
      { title: 'Map', key: 'map', sortable: false }, { title: 'Matchup', key: 'matchup', sortable: false },
      { title: 'Players', key: 'players', sortable: false }, { title: 'Length', key: 'dur', align: 'end' },
      { title: 'Result', key: 'won', sortable: false }, { title: 'File', key: 'file', sortable: false, align: 'center' },
    ]

    const setCount = computed(() => ['opponent_race', 'map', 'player', 'min_minutes', 'max_minutes'].filter((k) => f[k] != null && f[k] !== '').length)
    function clear() { Object.assign(f, { opponent_race: null, map: null, player: null, min_minutes: null, max_minutes: null }) }

    // frontend.md 10.4: one share scale for the whole column, the level-0 total
    const rootTotal = computed(() => cohort.value.length)
    return { rootTotal, f, sort, open, dialogRow, dialogOpen, headers, STATE, page, pages, pageRows, replays, tableRows, cohort,
      mapItems, playerItems, setCount, clear, toggle, showReplays, mobile, phone,
      RACES, PLAY_RACES: RACES, raceOf, nameOf, fmt, pct, mss, FLOOR, level }
  },
  template: `
<v-app>
  <header class="bar">
    <a class="brand" href="#">GNL replays</a>
    <nav class="chips" style="gap: 24px">
      <a v-for="n in ['Search', 'Openers', 'Stats']" :key="n" class="navlink" :class="{ on: n === 'Openers' }" :aria-current="n === 'Openers' ? 'page' : null" href="#">{{ n }}</a>
    </nav>
    <theme-menu class="push"></theme-menu>
  </header>

  <v-main>
    <div class="page">
      <!-- filter row -->
      <template v-if="!mobile">
        <div class="filters">
          <v-autocomplete class="f-race" v-model="f.race" :items="PLAY_RACES" item-title="name" item-value="id" label="Race"
            hide-details :clearable="false">
            <template #selection="{ item }"><span class="pn"><race-icon :race="item.raw.id"></race-icon>{{ item.raw.name }}</span></template>
            <template #item="{ props, item }"><v-list-item v-bind="props" :title="item.raw.name"><template #prepend><race-icon :race="item.raw.id" class="mr-3"></race-icon></template></v-list-item></template>
          </v-autocomplete>
          <v-autocomplete class="f-race" v-model="f.opponent_race" :items="RACES" item-title="name" item-value="id" label="Opponent race"
            hide-details clearable>
            <template #selection="{ item }"><span class="pn"><race-icon :race="item.raw.id"></race-icon>{{ item.raw.name }}</span></template>
            <template #item="{ props, item }"><v-list-item v-bind="props" :title="item.raw.name"><template #prepend><race-icon :race="item.raw.id" class="mr-3"></race-icon></template></v-list-item></template>
          </v-autocomplete>
          <v-autocomplete class="f-map" v-model="f.map" :items="mapItems" label="Map" hide-details clearable>
            <template #item="{ props, item }"><v-list-item v-bind="props" :subtitle="fmt(item.raw.n) + ' games'"></v-list-item></template>
          </v-autocomplete>
          <v-autocomplete class="f-player" v-model="f.player" :items="playerItems" label="Player" hide-details clearable>
            <template #item="{ props, item }"><v-list-item v-bind="props" :subtitle="fmt(item.raw.n) + ' games'"></v-list-item></template>
          </v-autocomplete>
          <v-text-field class="f-min" v-model.number="f.min_minutes" type="number" min="0" label="Min min" hide-details></v-text-field>
          <v-text-field class="f-min" v-model.number="f.max_minutes" type="number" min="0" label="Max min" hide-details></v-text-field>
          <v-btn v-if="setCount" variant="text" color="primary-text" @click="clear">Clear</v-btn>
          <v-spacer></v-spacer>
          <div class="seg" role="group" aria-label="Sort">
            <button class="chip" :class="{ on: sort === 'popular' }" :aria-pressed="sort === 'popular'" @click="sort = 'popular'">Most played</button><button class="chip" :class="{ on: sort === 'winrate' }" :aria-pressed="sort === 'winrate'" @click="sort = 'winrate'">Best win rate</button>
          </div>
        </div>
      </template>
      <template v-else>
        <v-autocomplete v-model="f.race" :items="PLAY_RACES" item-title="name" item-value="id" label="Race"
          hide-details :clearable="false" class="mb-3">
          <template #selection="{ item }"><span class="pn"><race-icon :race="item.raw.id"></race-icon>{{ item.raw.name }}</span></template>
          <template #item="{ props, item }"><v-list-item v-bind="props" :title="item.raw.name"><template #prepend><race-icon :race="item.raw.id" class="mr-3"></race-icon></template></v-list-item></template>
        </v-autocomplete>
        <v-expansion-panels variant="accordion" class="card rounded mb-3" flat>
          <v-expansion-panel>
            <v-expansion-panel-title>
              <span>Filters</span>
              <v-badge v-if="setCount" :content="setCount" inline color="primary" class="ml-1"></v-badge>
            </v-expansion-panel-title>
            <v-expansion-panel-text>
              <div class="filters-mobile">
                <v-autocomplete class="wide" v-model="f.opponent_race" :items="RACES" item-title="name" item-value="id" label="Opponent race" hide-details clearable></v-autocomplete>
                <v-autocomplete class="wide" v-model="f.map" :items="mapItems" label="Map" hide-details clearable></v-autocomplete>
                <v-autocomplete class="wide" v-model="f.player" :items="playerItems" label="Player" hide-details clearable></v-autocomplete>
                <v-text-field v-model.number="f.min_minutes" type="number" min="0" label="Min min" hide-details></v-text-field>
                <v-text-field v-model.number="f.max_minutes" type="number" min="0" label="Max min" hide-details></v-text-field>
                <v-btn v-if="setCount" class="wide" variant="text" color="primary-text" @click="clear">Clear</v-btn>
              </div>
            </v-expansion-panel-text>
          </v-expansion-panel>
        </v-expansion-panels>
        <div class="seg" role="group" aria-label="Sort">
          <button class="chip flex-grow-1 justify-center" :class="{ on: sort === 'popular' }" :aria-pressed="sort === 'popular'" @click="sort = 'popular'">Most played</button><button class="chip flex-grow-1 justify-center" :class="{ on: sort === 'winrate' }" :aria-pressed="sort === 'winrate'" @click="sort = 'winrate'">Best win rate</button>
        </div>
      </template>

      <v-card class="card mt-4" variant="flat">
          <div v-if="STATE === 'offline'" class="state-block">
            <h2 class="h3 mb-3">Warehouse offline</h2>
            <v-btn color="primary" variant="flat" prepend-icon="mdi-refresh">Retry</v-btn>
          </div>
          <div v-else-if="!f.race" class="race-pick">
            <v-btn v-for="r in PLAY_RACES" :key="r.id" variant="outlined" height="104" @click="f.race = r.id">
              <div class="d-flex flex-column align-center ga-2"><race-icon :race="r.id" :size="48"></race-icon><span>{{ r.name }}</span></div>
            </v-btn>
          </div>
          <template v-else>
          <div class="d-flex align-center px-4 pt-3 pb-1">
            <h2 class="h3">{{ fmt(cohort.length) }} player-games</h2>
          </div>
          <div v-if="!cohort.length" class="state-block">No opener matches. Widen the filters.</div>
          <v-table v-else class="tree" density="compact">
            <thead>
              <tr>
                <th>Opener</th>
                <th class="text-right">Games</th>
                <th class="text-right">Win rate</th>
                <th v-if="!mobile" class="text-right">Avg min</th>
                <th style="width: 44px"></th>
              </tr>
            </thead>
            <tbody>
              <template v-for="r in tableRows" :key="r.key">
                <tr v-if="r.type === 'node'" class="node" @click="toggle(r)"
                    tabindex="0" @keydown.enter="toggle(r)" :aria-expanded="r.branches ? r.isOpen : undefined">
                  <td>
                    <div class="opener" :style="{ paddingLeft: (r.depth - 1) * (phone ? 8 : 16) + 'px' }">
                      <v-icon class="chev" size="20">{{ r.branches ? (r.isOpen ? 'mdi-chevron-down' : 'mdi-chevron-right') : '' }}</v-icon>
                      <div class="icons">
                        <template v-if="phone && r.depth > 3"><v-icon size="14" class="faint">mdi-dots-horizontal</v-icon></template>
                        <obj-icon v-for="(c, i) in (phone ? r.path.slice(Math.max(0, r.depth - 3), -1) : r.path.slice(0, -1))" :key="i"
                          :code="c" :size="phone ? 20 : 28" dim></obj-icon>
                        <obj-icon :code="r.code" :size="phone ? 20 : 28"></obj-icon>
                      </div>
                      <span v-if="!phone" class="name">{{ nameOf(r.code) }}</span>
                      <span v-if="r.branches && !phone" class="tag">{{ r.branches }}</span>
                    </div>
                    <div v-if="phone" class="pname" :style="{ paddingLeft: (r.depth - 1) * 8 + 26 + 'px' }">{{ nameOf(r.code) }}</div>
                  </td>
                  <td>
                    <v-tooltip location="top" :text="fmt(r.games) + ' of ' + fmt(r.parentTotal) + ' player-games'">
                      <template #activator="{ props }">
                        <div v-bind="props" class="cell-mark" :class="{ stack: phone }">
                          <span class="v num">{{ fmt(r.games) }}</span><share-bar :games="r.games" :total="rootTotal"></share-bar>
                        </div>
                      </template>
                    </v-tooltip>
                  </td>
                  <td>
                    <v-tooltip location="top" :text="fmt(r.wins) + ' wins of ' + fmt(r.games) + ' games'">
                      <template #activator="{ props }">
                        <div v-bind="props" class="cell-mark" :class="{ stack: phone }">
                          <span class="v num" :class="{ muted: r.games < FLOOR }">{{ pct(r.rate) }}</span>
                          <win-mark v-if="r.games >= FLOOR" :wins="r.wins" :games="r.games"></win-mark>
                          <svg v-else width="64" height="10" aria-hidden="true"></svg>
                        </div>
                      </template>
                    </v-tooltip>
                  </td>
                  <td v-if="!mobile" class="text-right num">{{ r.avg.toFixed(1) }}</td>
                  <td class="text-right">
                    <v-btn icon="mdi-play-box-multiple" size="small" variant="text" :aria-label="'Games with ' + nameOf(r.code)"
                      @click.stop="showReplays(r)"></v-btn>
                  </td>
                </tr>
                <tr v-else>
                  <td>
                    <div class="opener stopped" :style="{ paddingLeft: (r.depth - 1) * (phone ? 8 : 16) + 26 + 'px' }">Stopped here</div>
                  </td>
                  <td><div class="cell-mark" :class="{ stack: phone }"><span class="v num muted">{{ fmt(r.games) }}</span><share-bar :games="r.games" :total="rootTotal"></share-bar></div></td>
                  <td></td><td v-if="!mobile"></td><td></td>
                </tr>
              </template>
            </tbody>
          </v-table>
          </template>
      </v-card>

      <v-dialog v-model="dialogOpen" :fullscreen="phone" max-width="1100" scrollable>
        <v-card v-if="dialogRow" variant="flat">
          <div class="d-flex align-center ga-2 px-4 py-2">
            <div class="d-flex ga-1 align-center">
              <obj-icon v-for="(c, i) in dialogRow.path" :key="i" :code="c" :size="20" :dim="i < dialogRow.path.length - 1"></obj-icon>
            </div>
            <h2 class="h3">{{ fmt(replays.length) }} player-games</h2>
            <v-spacer></v-spacer>
            <v-btn icon="mdi-close" variant="text" size="small" aria-label="Close" @click="dialogOpen = false"></v-btn>
          </div>
          <v-divider></v-divider>
          <v-card-text class="pa-0">
            <v-data-table v-if="!phone" :headers="headers" :items="replays" :items-per-page="25" density="compact" hover :item-value="(r) => r.id + '.' + r.pid">
              <template #item.map="{ item }">{{ item.map || 'Unknown map' }}</template>
              <template #item.matchup="{ item }"><span class="d-inline-flex align-center ga-1"><race-icon :race="item.race"></race-icon><span class="small muted">v</span><race-icon :race="item.opp"></race-icon></span></template>
              <template #item.players="{ item }"><span class="d-inline-flex flex-wrap align-center ga-3">
                <span class="pn" :class="item.won ? 'font-weight-bold' : 'muted'">{{ item.player }}<race-icon :race="item.race"></race-icon></span>
                <span class="pn" :class="item.won ? 'muted' : 'font-weight-bold'">{{ item.oppName }}<race-icon :race="item.opp"></race-icon></span>
              </span></template>
              <template #item.dur="{ item }"><span class="num">{{ mss(item.dur) }}</span></template>
              <template #item.won="{ item }"><span class="d-inline-flex align-center ga-2 text-no-wrap"><span class="dot" :class="item.won ? 'win' : 'loss'"></span>{{ item.won ? 'Won' : 'Lost' }}</span></template>
              <template #item.file="{ item }"><v-btn icon="mdi-download" size="small" variant="text" aria-label="Download .w3g" @click.stop></v-btn></template>
            </v-data-table>
            <template v-else>
              <a v-for="r in pageRows" :key="r.id + '.' + r.pid" class="rep" :href="'/replays/' + r.id" @click.prevent>
                <div class="main">
                  <div class="players" :class="{ col: phone }">
                    <span class="pn" :class="{ 'font-weight-bold': r.won }">{{ r.player }}<race-icon :race="r.race"></race-icon></span>
                    <span v-if="!phone" class="muted">v</span>
                    <span class="pn" :class="{ 'font-weight-bold': !r.won }"><span v-if="phone" class="muted vs">v</span>{{ r.oppName }}<race-icon :race="r.opp"></race-icon></span>
                  </div>
                  <div class="meta">
                    <span>{{ r.map || 'Unknown map' }}</span>
                    <span class="num">{{ mss(r.dur) }}</span>
                    <span class="res d-inline-flex align-center ga-1"><span class="dot" :class="r.won ? 'win' : 'loss'"></span>{{ r.won ? 'Won' : 'Lost' }}</span>
                  </div>
                </div>
                <v-btn icon="mdi-download" size="small" variant="text" aria-label="Download replay" @click.stop.prevent></v-btn>
              </a>
              <v-pagination v-if="pages > 1" v-model="page" :length="pages" :total-visible="phone ? 3 : 5" density="compact" class="py-2"></v-pagination>
            </template>
          </v-card-text>
        </v-card>
      </v-dialog>
    </div>
  </v-main>
</v-app>`,
}
