# Copy to .github/workflows/ci.yml. A gym-root hook keeps Claude from writing there.
# What needs a built warehouse (dbt build and test, the API cases and oracles, e2e) is not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline/parse-rs
      - run: cargo test --manifest-path pipeline/parse-rs/Cargo.toml --locked
      - run: cargo clippy --manifest-path pipeline/parse-rs/Cargo.toml --all-targets -- -D warnings

  # The compiler's SQL goldens, the offline app tests and the knowledge bundle test; no server needed.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --directory api --frozen pytest tests/test_compile.py tests/test_app.py tests/test_okf.py

  # The project parses: models, tests, seeds and macros are well formed. No connection.
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx dbt@2.0.6 parse --project-dir dbt --profiles-dir dbt --target-path /tmp/dbt-target --log-path /tmp/dbt-logs --no-send-anonymous-usage-stats

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
      - run: pnpm build
        working-directory: web

  # The compose file and the box script are well formed.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
      - run: shellcheck infrastructure/box/bootstrap.sh

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.drain
          push: true
          tags: |
            ghcr.io/warcraft-gym/wc3-gym-warehouse-drain:latest
            ghcr.io/warcraft-gym/wc3-gym-warehouse-drain:${{ github.sha }}
