# Copy to .github/workflows/ci.yml. A gym-root hook keeps Claude from writing there.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline/parse-rs
      - run: cargo test --manifest-path pipeline/parse-rs/Cargo.toml

  # The API compiler's SQL goldens; no server needed.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --directory api --frozen pytest tests/test_compile.py

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.drain
          push: true
          tags: |
            ghcr.io/warcraft-gym/wc3-gym-warehouse-drain:latest
            ghcr.io/warcraft-gym/wc3-gym-warehouse-drain:${{ github.sha }}
